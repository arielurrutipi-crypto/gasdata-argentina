name: Actualizar datos
on:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'data/infrastructure-decisions.json'
      - '.github/workflows/update-data.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gasdata-update
  cancel-in-progress: true
jobs:
  update:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/news-translation
          key: news-translation-argos-en-es-1.0
      - name: Instalar lector PDF
        run: pip install pypdf beautifulsoup4 pdfplumber openpyxl xlrd "ctranslate2>=4,<5" "sentencepiece>=0.2,<0.3"
      - name: Instalar entorno de pruebas del portal
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Probar lectores antes de modificar datos
        run: |
          python -m unittest discover -s scripts -p 'test_pipeline_runner.py'
          python -m unittest discover -s scripts -p 'test_regulatory_catalogue.py'
          node scripts/test_pages_artifact.cjs
          node scripts/test_technical_regulations.cjs
          python -m unittest discover -s scripts -p 'test_automatic_sources.py'
          python -m unittest discover -s scripts -p 'test_news_reader.py'
          python -m unittest discover -s scripts -p 'test_infrastructure.py'
          python -m unittest discover -s scripts -p 'test_infrastructure_layers.py'
          python -m unittest discover -s scripts -p 'test_tariff_comparison.py'
          python -m unittest discover -s scripts -p 'test_tariff_pdf.py'
          python -m unittest discover -s scripts -p 'test_transport_tariffs.py'
          node scripts/test_bill_estimator.cjs
          npm run test:portal
      - name: Actualizar y guardar fuentes
        run: |
          git config user.name "gasdata-bot"
          git config user.email "actions@users.noreply.github.com"
          for intento in 1 2 3; do
            echo "Intento $intento"
            git fetch origin main
            git reset --hard origin/main
            python -u scripts/update_pipeline.py
            git add data/data.json data/tariff-comparison data/infrastructure.json data/infrastructure-layers.json
            if git diff --cached --quiet; then
              echo "Sin cambios"
              exit 0
            fi
            git commit -m "Actualización automática de fuentes"
            if git push origin main; then
              exit 0
            fi
            echo "El repositorio cambió durante la actualización; reintentando..."
            sleep 2
          done
          echo "No se pudo guardar tras 3 intentos"
          exit 1

  deploy:
    needs: update
    uses: ./.github/workflows/pages.yml
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
