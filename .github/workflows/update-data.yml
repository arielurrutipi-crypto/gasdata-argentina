name: Actualizar datos
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar fuentes
        run: python scripts/update_pipeline.py
      - name: Guardar validaciones y novedades
        run: |
          git config user.name "gasdata-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualización automática de fuentes"
            git push
          fi
