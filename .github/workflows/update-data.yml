name: Actualizar datos
on:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/update-data.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector PDF
        run: pip install pypdf
      - name: Actualizar y guardar fuentes
        run: |
          git config user.name "gasdata-bot"
          git config user.email "actions@users.noreply.github.com"
          for intento in 1 2 3; do
            echo "Intento $intento"
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_pipeline.py
            git add data/data.json
            if git diff --cached --quiet; then
              echo "Sin cambios"
              exit 0
            fi
            git commit -m "Actualización automática de fuentes"
            if git push origin main; then
              exit 0
            fi
            echo "El repositorio cambió durante la actualización; reintentando..."
            sleep 2
          done
          echo "No se pudo guardar tras 3 intentos"
          exit 1

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar datos actualizados
        id: deployment
        uses: actions/deploy-pages@v4
