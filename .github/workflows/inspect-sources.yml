name: Verificar lectores de fuentes
on:
  push:
    paths: ['scripts/inspect_sources.py', '.github/workflows/inspect-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 openpyxl xlrd pdfplumber
      - run: python -u scripts/inspect_sources.py
